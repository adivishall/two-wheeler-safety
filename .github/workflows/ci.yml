name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions catch version-specific breakage without doubling cost for
        # little value; the project targets 3.10+.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (lean, model-free, pinned)
        run: |
          python -m pip install --upgrade pip
          # CI uses requirements-ci.txt, NOT requirements.txt: the trained YOLO
          # weights and the torch/ultralytics/easyocr stack are unavailable in
          # CI, and the suite is model-free by design. constraints-ci.txt pins
          # the whole resolved closure to exact, known-good versions so the
          # environment is reproducible instead of drifting with upstream.
          pip install -r requirements-ci.txt -c constraints-ci.txt

      - name: Verify environment is consistent
        run: |
          # Fail fast if the pinned set has conflicting dependencies.
          pip check
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, core modules)
        run: mypy

      - name: Run tests (with branch coverage gate)
        run: pytest tests/ -q --cov --cov-report=term-missing

      # The full model evaluation needs weights, a dataset and a GPU-ish
      # machine, so it is run by hand — which leaves the evaluation tooling free
      # to rot silently between runs. These smoke tests exercise the entry
      # points that need neither: they run the real tracking, association,
      # violation, OCR-policy and speed evaluations on synthetic inputs and
      # assert the reports are produced. Nothing here downloads weights, touches
      # the network, or needs a GPU.
      - name: Evaluation tooling smoke test (model-free)
        run: |
          python evaluate_pipeline.py --out "$RUNNER_TEMP/eval" --trials 3
          python evaluate_system.py --json "$RUNNER_TEMP/eval/system.json"
          python evaluate_ocr.py --simulate --out "$RUNNER_TEMP/eval" --name ocr_sim
          # Every CLI must at least parse its arguments without the heavy stack.
          for cli in evaluate_model evaluate_ocr evaluate_pipeline \
                     evaluate_system compare_models audit_dataset \
                     dataset_manifest train_traffic benchmark; do
            python "$cli.py" --help > /dev/null || exit 1
          done

      - name: Check the generated reports exist and are well-formed
        run: |
          python - <<'PY'
          import csv, json, os
          root = os.path.join(os.environ["RUNNER_TEMP"], "eval")
          summary = json.load(open(os.path.join(root, "latest.json")))
          assert summary["end_to_end"]["precision"] >= 0.0
          assert summary["error_budget"]["bottleneck"]
          with open(os.path.join(root, "pipeline_evaluation.csv")) as fh:
              rows = list(csv.DictReader(fh))
          assert rows, "no metric rows written"
          for r in rows:
              float(r["value"])  # every value must be numeric
          print(f"OK: {len(rows)} metric rows, "
                f"bottleneck={summary['error_budget']['bottleneck']}")
          PY
