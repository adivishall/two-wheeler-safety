# Project tooling config. The project is run as loose scripts/modules (there is
# no package to build), so this file only configures the linter.

[tool.ruff]
line-length = 100
target-version = "py310"
# Local, untracked experiment scratch (helmet-model retraining probes and their
# working dataset) are not part of the shipped project and are excluded from
# linting. CI only ever checks out tracked files, so this just keeps a local
# `ruff check .` aligned with CI.
extend-exclude = ["_*.py", "dataset_helmet_clean", "runs", "evidence", "reports"]

[tool.ruff.lint]
# A pragmatic, high-signal rule set: pyflakes (real errors: undefined names,
# unused imports), pycodestyle errors/warnings, and import sorting.
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Branch coverage (Phase 25). Run: `pytest --cov=modules --cov-branch`.
# The model-free suite structurally CANNOT cover the two modules that only run
# once torch/EasyOCR are loaded (modules/detector.py loads the models;
# modules/plate_ocr.py is a thin model-dependent wrapper), so they are omitted
# from the headline number rather than dragging it down with code no unit test
# is meant to exercise. Their behaviour is covered by the offline evaluation
# tooling and the integration test (with fakes), not by unit coverage.
[tool.coverage.run]
branch = true
source = ["modules"]
omit = ["modules/detector.py", "modules/plate_ocr.py"]

[tool.coverage.report]
# Don't let an un-exercised branch pass silently: fail the report under this
# floor. The measured branch coverage of the covered modules is ~95%.
fail_under = 90
show_missing = true
skip_covered = true

# Static typing (Phase 24). Scoped to the core-logic modules — the parts where a
# type error would be a real bug (DB, config, confidence, association, tracking
# math, state machines, validation) — rather than the whole tree, so the check
# is fast and its green bar is meaningful. cv2/torch/ultralytics/easyocr ship no
# (or partial) stubs, so their imports are ignored; that does not weaken checking
# of our own code. Run: `python3 -m mypy` (config-driven) or `mypy modules`.
[tool.mypy]
python_version = "3.11"
files = [
    "modules/config.py",
    "modules/db.py",
    "modules/confidence.py",
    "modules/association.py",
    "modules/geometry.py",
    "modules/violation_state.py",
    "modules/validation.py",
    "modules/jobs.py",
    "modules/plate_info.py",
    "modules/plate_recognizer.py",
    "modules/evidence.py",
    "modules/model_manifest.py",
    "modules/profiling.py",
    "modules/logging_setup.py",
    "modules/ocr_preprocess.py",
    "modules/speed.py",
    "modules/calibration.py",
]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
# Pragmatic strictness: catch the real mistakes without demanding a fully
# annotated codebase everywhere.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_unreachable = true
